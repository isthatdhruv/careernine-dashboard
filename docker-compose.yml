version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: careernine-app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/report-gen-english/.venv
      - /app/report-gen-hindi/.venv
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    networks:
      - careernine-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: careernine-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - careernine-network
    restart: unless-stopped

networks:
  careernine-network:
    driver: bridge
